<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>금솔 순위판 데이터 넣기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:#f3f5f2;color:#1d2420;display:flex;justify-content:center;padding:40px 16px}
.box{width:100%;max-width:460px;background:#fff;border:1px solid #e0e5dd;border-radius:20px;padding:28px 24px;box-shadow:0 20px 50px rgba(20,60,40,.1);display:flex;flex-direction:column;gap:14px}
h1{font-size:21px;margin:0}p{margin:0;color:#6b7468;font-size:14px;line-height:1.55}
label{font-size:13px;font-weight:700;color:#3d4a42}input{font:inherit;font-size:15px}
input[type=password]{height:44px;border:1px solid #cdd5c9;border-radius:12px;padding:0 12px}
button{height:46px;border:0;border-radius:12px;background:#17784a;color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:default}
.bar{height:10px;background:#e7ece5;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#17784a;transition:width .2s}
#msg{font-size:14px;white-space:pre-line}.err{color:#c0392b}.ok{color:#17784a;font-weight:700}a{color:#17784a}
</style></head><body>
<form class="box" id="f">
<h1>순위판 데이터 넣기</h1>
<p>Claude 순위판에서 뽑은 <b>금솔_사이트_옮기기.zip</b> 파일을 골라 넣으면 이 사이트로 옮겨져요. 한 번만 하면 돼요.</p>
<label>팀 비밀번호<br><input type="password" id="pw" style="width:100%;box-sizing:border-box" required></label>
<label>zip 파일<br><input type="file" id="zf" accept=".zip" required></label>
<button id="go">옮기기 시작</button>
<div class="bar"><i id="bar"></i></div>
<div id="msg"></div>
</form>
<script>
var U="https://dvszdngnghmpilmxvefn.supabase.co",K="sb_publishable_t0CDzd9HWB6eVeOHkD2u2Q_Y8kiPLmi",TK="";
async function sha(s){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
function H(x){var h={apikey:K,"x-team-key":TK};for(var k in x||{})h[k]=x[k];return h}
async function call(p,o){var r=await fetch(U+p,o);if(!r.ok)throw new Error(r.status+" "+(await r.text()).slice(0,200));return r}
var msg=document.getElementById("msg"),bar=document.getElementById("bar");
function say(t,c){msg.className=c||"";msg.textContent=t}
document.getElementById("f").addEventListener("submit",async function(e){e.preventDefault();var go=document.getElementById("go");go.disabled=true;
 try{TK=await sha(document.getElementById("pw").value.trim());
  var ok=await (await call("/rest/v1/rpc/team_ok",{method:"POST",headers:H({"Content-Type":"application/json"}),body:"{}"})).json();
  if(ok!==true){say("비밀번호가 맞지 않아요.","err");go.disabled=false;return}
  try{localStorage.setItem("gs-team-key",TK)}catch(_){}
  say("파일 여는 중...");var z=await JSZip.loadAsync(document.getElementById("zf").files[0]);
  var rows=JSON.parse(await z.file("docs.json").async("string"));
  var media=Object.keys(z.files).filter(function(n){return !z.files[n].dir&&/^(shots|blob)\//.test(n)});
  var total=Math.ceil(rows.length/100)+media.length,done=0;function step(){done++;bar.style.width=(100*done/total)+"%"}
  for(var i=0;i<rows.length;i+=100){say("글·순위 자료 넣는 중 ("+Math.min(i+100,rows.length)+"/"+rows.length+")");
   await call("/rest/v1/docs?on_conflict=coll,id",{method:"POST",headers:H({"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify(rows.slice(i,i+100))});step()}
  var fail=[],idx=0;
  async function worker(){while(idx<media.length){var n=media[idx++];try{var b=await z.file(n).async("uint8array");
     var ct=n.startsWith("shots/")?"image/jpeg":(b[0]===0x89&&b[1]===0x50?"image/png":"image/jpeg");
     var r=await fetch(U+"/storage/v1/object/files/"+n,{method:"POST",headers:H({"Content-Type":ct}),body:b});if(!r.ok){var t=await r.text();if(!(r.status===409||/Duplicate|already exists/i.test(t)))throw new Error(r.status+" "+t.slice(0,200))}}catch(err){fail.push(n+": "+err.message)}
    step();say("사진·캡처 올리는 중 ("+done+"/"+total+")")}}
  await Promise.all([worker(),worker(),worker(),worker()]);
  if(fail.length)say("자료 "+rows.length+"개는 넣었고, 사진 "+fail.length+"개가 실패했어요. 한 번 더 눌러 주세요.\n"+fail.slice(0,3).join("\n"),"err");
  else say("다 옮겼어요! 자료 "+rows.length+"개, 사진·캡처 "+media.length+"개.\n이제 순위판으로 가세요 →","ok"),msg.insertAdjacentHTML("beforeend",' <a href="./">순위판 열기</a>');
 }catch(err){say("문제가 생겼어요: "+err.message,"err")}
 go.disabled=false});
</script></body></html>
