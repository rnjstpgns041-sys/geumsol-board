function makeDemo(){
  const pool=["다이어트 한약","교통사고 한의원","허리디스크 치료","추나요법","비염 한의원","산후보약","목디스크","무릎 통증","불면증 한의원","여드름 한의원","갱년기 한약","수험생 보약","도수치료","어깨 통증","소아 성장"];
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const m=new Map();let i=0;
  for(const [cid,c] of sortedClients()){
    const n=1+Math.floor(rnd()*3);
    for(let j=0;j<n;j++){
      const kw=pool[(hash(c.name)+j*5)%pool.length];
      let r=Math.ceil(rnd()*18);const ranks=[];
      for(let d=13;d>=0;d-=1+Math.floor(rnd()*2)){
        if(d===0&&rnd()<.45)continue;
        r=Math.max(1,Math.min(28,r+Math.round((rnd()-.58)*5)));
        ranks.push({d:addDays(-d),r:rnd()<.07?null:r});
      }
      const ranksT=ranks.map(x=>({d:x.d,r:x.r==null||rnd()<.12?null:Math.max(1,x.r+Math.round((rnd()-.4)*6))}));
      const l=ranks[ranks.length-1];
      m.set("demo"+(i++),{clientId:cid,keyword:kw,stage:l&&l.r!=null?"노출 중":"발행 완료",postUrl:"",ranks,ranksT,createdAt:i});
    }
  }
  return m;
}

function summary(){
  const t=today();const out={active:0,byStatus:{},kw:0,top5:0,top10:0,todo:0,done:0,noKw:0,bands:[0,0,0,0,0]};
  for(const [cid,c] of S.clients){out.byStatus[c.status||"진행중"]=(out.byStatus[c.status||"진행중"]||0)+1;if(active(c)){out.active++;if(!kwsOf(cid).length)out.noKw++;}}
  for(const [,k] of K()){const c=S.clients.get(k.clientId);if(!c)continue;out.kw++;const l=latest(k);const b=band(l);out.bands[b]++;
    if(b===0)out.top5++;if(b<=1)out.top10++;
    if(trackable(c,k)){if(doneToday(k))out.done++;else out.todo++;}}
  return out;
}
function clientStats(cid){
  const t=today(),ks=kwsOf(cid);const bands=[0,0,0,0,0];let best=null,done=0,total=0,last=null;
  for(const [,k] of ks){const l=latest(k);bands[band(l)]++;if(l&&l.r!=null&&(best==null||l.r<best))best=l.r;const lc=lastCheck(k);if(lc&&(!last||lc>last))last=lc;
    if(k.stage!=="보류"){total++;if(doneToday(k))done++;}}
  return {ks,bands,best,done,total,last};
}
function movers(){
  const out=[];
  for(const [id,k] of K()){const c=S.clients.get(k.clientId);if(!c)continue;const l=latest(k),p=prevOf(k);if(!l||!p)continue;
    let diff=null;if(l.r!=null&&p.r!=null)diff=p.r-l.r;else if(l.r==null&&p.r!=null)diff=-(31-p.r);else if(l.r!=null&&p.r==null)diff=31-l.r;
    if(diff)out.push({id,k,c,l,p,diff});}
  return out;
}
function attention(){
  const items=[];
  for(const m of movers())if(m.diff<=-3)items.push({sev:m.l.r==null?0:1,cid:m.k.clientId,t:m.c.name,d:`${m.k.keyword} · ${m.p.r==null?"미노출":m.p.r+"위"} → ${m.l.r==null?"미노출":m.l.r+"위"}`,tag:m.l.r==null?["순위 밖","t-bad"]:["하락","t-warn"]});
  for(const [id,k] of K()){const c=S.clients.get(k.clientId);if(!c||!trackable(c,k))continue;const lc=lastCheck(k);const n=lc?daysAgo(lc):Infinity;
    if(n>=7&&n!==Infinity)items.push({sev:2,cid:k.clientId,t:c.name,d:`${k.keyword} · ${n}일째 확인 안 함`,tag:["미확인","t-neutral"]});}
  for(const [,x] of S.contracts){const c=S.clients.get(x.clientId);if(!c)continue;const st=cStatus(x);const left=Math.max(0,(x.total||0)-(x.done||0));
    if((st.key==="soon"||st.key==="over")&&left>0)items.push({sev:st.key==="over"?0:1,cid:x.clientId,t:c.name,d:`계약 ${st.key==="over"?"종료":"종료 "+st.dday} · 남은 발행 ${left}건`,tag:[st.key==="over"?"계약 종료":"종료 임박",st.key==="over"?"t-bad":"t-warn"]});}
  for(const [cid,c] of sortedClients())if(active(c)&&!kwsOf(cid).length)items.push({sev:3,cid,t:c.name,d:"키워드가 아직 없어요",tag:["키워드 없음","t-info"]});
  return items.sort((a,b)=>a.sev-b.sev);
}

function trendChart(){
  // 최근 14일, 날짜별 10위 안 키워드 수와 확인한 키워드 수
  const days=[];for(let i=13;i>=0;i--)days.push(addDays(-i));
  const rows=days.map(d=>{let chk=0,t10=0;for(const [,k] of K()){if(!S.clients.has(k.clientId))continue;const r=(k[FIELD[S.tab]]||[]).find(x=>x.d===d);if(r){chk++;if(r.r!=null&&r.r<=10)t10++;}}return {d,chk,t10};});
  const max=Math.max(4,...rows.map(r=>r.chk));const step=max<=8?2:max<=20?5:10;const top=Math.ceil(max/step)*step;
  const W=640,H=170,L=30,R=8,T=10,B=24,bw=(W-L-R)/14;
  const y=v=>T+(H-T-B)*(1-v/top);
  let g="";for(let v=0;v<=top;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`;
  let bars="";rows.forEach((r,i)=>{const x=L+i*bw+bw*.18,w=bw*.64;
    if(r.chk){bars+=`<rect x="${x}" y="${y(r.chk)}" width="${w}" height="${y(0)-y(r.chk)}" rx="3" fill="var(--accent-soft)"/>`;
      if(r.t10)bars+=`<rect x="${x}" y="${y(r.t10)}" width="${w}" height="${y(0)-y(r.t10)}" rx="3" fill="var(--accent)"/>`;
      if(i===13||r.chk===max)bars+=`<text x="${x+w/2}" y="${y(r.chk)-4}" text-anchor="middle" font-size="10.5" fill="var(--fg)" font-family="IBM Plex Mono,monospace" font-weight="600">${r.t10}/${r.chk}</text>`;}
    else bars+=`<rect x="${x}" y="${y(0)-2}" width="${w}" height="2" rx="1" fill="var(--line-strong)"/>`;
    if(i%2===1||i===13)bars+=`<text x="${x+w/2}" y="${H-7}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${i===13?"오늘":shortDate(r.d)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 14일 날짜별 10위 안 키워드 수">${g}${bars}</svg>`;
}

function boardCards(){

  r.forEach((p,i)=>{if(p.r==null){started=false;flush();pts+=`<circle cx="${x(i)}" cy="${H-py}" r="2.5" fill="var(--surface)" stroke="var(--bad)" stroke-width="1.2"/>`;return;}
    const X=x(i).toFixed(1),Y=y(p.r).toFixed(1);path+=(started?"L":"M")+X+" "+Y;seg.push([X,Y]);started=true;});flush();
  const last=r[r.length-1];if(last.r!=null)pts+=`<circle cx="${x(r.length-1)}" cy="${y(last.r)}" r="3.2" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="최근 순위 추이, 위로 갈수록 상위">
    <line x1="0" x2="${W}" y1="${y(Math.min(5,max))}" y2="${y(Math.min(5,max))}" stroke="var(--r1)" stroke-dasharray="3 3" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".6"/>
    ${area}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${pts}</svg>`;
}

function dday(end){if(!end)return null;return -daysAgo(end);}
function cStatus(x){
  const t=today(),left=(x.total||0)-(x.done||0),dd=dday(x.end);
  const ddTxt=dd==null?"":dd===0?"D-DAY":dd>0?"D-"+dd:"D+"+(-dd);
  if(x.total&&left<=0)return {key:"done",label:"발행 완료",tone:"t-good",dday:ddTxt};
  if(x.start&&x.start>t)return {key:"wait",label:"시작 전",tone:"t-neutral",dday:ddTxt};
  if(dd!=null&&dd<0)return {key:"over",label:"기간 종료",tone:"t-bad",dday:ddTxt};
  if(dd!=null&&dd<=14)return {key:"soon",label:"종료 임박",tone:"t-warn",dday:ddTxt};
  return {key:"run",label:"진행 중",tone:"t-info",dday:ddTxt};
}
function renewList(){
  const t=today(),out=[];
  for(const [id,x] of S.contracts.entries()){
    if(!S.clients.has(x.clientId)||!x.end)continue;const dd=dday(x.end);
    if(dd==null||dd>14||dd<-14)continue;
    if([...S.contracts.values()].some(y=>y!==x&&y.clientId===x.clientId&&(y.end||"")>x.end))continue;
    out.push([id,x,dd]);}
  return out.sort((a,b)=>a[2]-b[2]);
}

async function recordPostRank(pid,r,tab){
  const p=S.posts.get(pid);if(!p)return;const d=today();
  const ranks=ranksOf(p,tab).filter(x=>x.d!==d);ranks.push({d,r});
  const ok=await write(()=>db.collection("posts").doc(pid).update({[FIELD[tab]]:ranks}),`${p.keyword} ${WHERE[tab]}: ${r==null?"미노출":r+"위"} 기록`);
  if(ok&&p.kwId&&S.real.has(p.kwId))await recordRank(p.kwId,r,tab);
}

/* ---------- report ---------- */
const RP={cid:null,date:null,tab:"blog",picked:new Set(),rank:{},url:{},mgr:null,done:null,total:null,edited:false,showTpl:false};
function activeContract(cid){const cs=contractsOf(cid);return (cs.find(([,x])=>["run","soon","wait"].includes(cStatus(x).key))||cs[0]||[])[1]||null;}
function rpInit(cid){
  RP.cid=cid;RP.picked=new Set();RP.rank={};RP.url={};RP.edited=false;
  RP.mgr=(S.report.managers||{})[cid]||(()=>{const p=[...S.posts.values()].filter(x=>x.clientId===cid&&S.blogNames[x.blog]).sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0];return p&&S.blogNames[p.blog]||"";})();const ac=activeContract(cid);RP.done=ac?ac.done||0:"";RP.total=ac?ac.total||0:"";
  const t=today();for(const [id,k] of kwsOf(cid)){const l=latest(k,RP.tab),m=myRank(k,RP.tab);if(l&&l.d===t&&m&&m.pos.length)RP.picked.add(id);}
}
/* the report counts only posts on the registered blogs/cafes: positions saved with each check (mine/mu), or found in that day's top 10; null = not known */
function isMine(u){const m=/(blog|cafe)\.naver\.com\/([^/?#]+)\//.exec(u||"");return !!m&&(m[1]==="blog"?S.blogs:S.cafes).includes(m[2]);}
function myRank(k,tab){const l=latest(k,tab);if(!l)return null;if(Array.isArray(l.mine))return {pos:l.mine,url:l.mu||""};const tp=k.top&&k.top.d===l.d&&k.top[tab];if(!tp)return null;const h=tp.filter(e=>isMine(e.url));return {pos:h.map(e=>e.pos),url:h[0]?h[0].url:""};}
function rpRank(id,k){if(id in RP.rank)return RP.rank[id];const m=myRank(k,RP.tab);if(m)return m.pos.length?m.pos.join(", "):"미노출";const l=latest(k,RP.tab);return l&&l.r==null?"미노출":"";}
function rpUrl(id,k){if(id in RP.url)return RP.url[id];const m=myRank(k,RP.tab);return m&&m.url||k.postUrl||"";}
function fill(tpl,m){return tpl.replace(/\{(날짜|업체|담당|발행0|발행|계약|키워드|순위|링크)\}/g,(_,key)=>m[key]??"");}
function rpText(){
  const c=S.clients.get(RP.cid);if(!c)return"";
  const [y,mo,d]=(RP.date||today()).split("-");
  const T=curTpl(),head=fill(T.head,{날짜:`${mo}/${d}`,업체:c.name,담당:RP.mgr,발행:RP.done,발행0:RP.done===""?"":String(RP.done).padStart(2,"0"),계약:RP.total}).replace(/__+/g,"_");
  const lines=kwsOf(RP.cid).filter(([id])=>RP.picked.has(id)).map(([id,k])=>{const r=rpRank(id,k).trim();
    return fill(T.line,{키워드:k.keyword,순위:r===""?"":/^[\d, ]+$/.test(r)?r+"위":r,링크:rpUrl(id,k)}).replace(/_\n/,"\n").replace(/\n$/,"");});
  return head+(lines.length?(T.gap??"\n\n")+lines.join("\n\n"):"");
}

      <label class="chk"><input type="checkbox" id="onlytodo" ${onlyTodo?"checked":""}> 오늘 다 확인한 키워드 숨기기</label>

let pointerDown=false,pending=false;
document.addEventListener("pointerdown",()=>{pointerDown=true;},true);

/* ---------- 분석 (insight) ---------- */
const INS={kw:null};
function bestRank(k,tb){const l=latest(k,tb);return l&&l.r!=null?l.r:null;}
function changeList(){const out={top:[],up:[],down:[],gone:[],fresh:[],skipped:0};let last="";
  for(const [id,k] of K()){const c=S.clients.get(k.clientId);if(!c||!active(c))continue;
    for(const tb of TABS){const l=latest(k,tb),p=prevOf(k,tb);if(!l)continue;if(l.d>last)last=l.d;if(!p)continue;
      // compare only checks made under the same rule (thumbnail / name / no thumbnail); a rule change is not a real move
      if((l.by||"name")!==(p.by||"name")){out.skipped++;continue;}
      const it={id,k,c,tb,l,p,a:p.r==null?"미노출":p.r+"위",b:l.r==null?"미노출":rks(l)+"위"};
      if(l.r!=null&&l.r<=3&&(p.r==null||p.r>3))out.top.push(it);
      else if(l.r==null&&p.r!=null)out.gone.push(it);
      else if(l.r!=null&&p.r==null)out.fresh.push(it);
      else if(l.r!=null&&p.r!=null&&p.r-l.r>=3)out.up.push(it);
      else if(l.r!=null&&p.r!=null&&l.r-p.r>=3)out.down.push(it);}}
  return {...out,last};}
function chgRows(list){return list.length?`<ul class="ilist">${list.slice(0,12).map(x=>`<li><span class="lbl">${esc(x.c.name)}</span><b>${esc(x.k.keyword)}</b><span class="lbl">${WHERE[x.tb]}</span><span>${x.a} → <b>${x.b}</b></span>${camBtn(x.id,x.k,x.tb)}</li>`).join("")}${list.length>12?`<li class="lbl">외 ${list.length-12}개</li>`:""}</ul>`:`<p class="empty-mini">없어요</p>`;}
function noThumbClients(){return sortedClients().filter(([cid,c])=>active(c)&&kwsOf(cid).length&&!thumbsOf(cid).length);}
function perfRows(){return sortedClients().filter(([cid,c])=>active(c)&&(kwsOf(cid).length||contractsOf(cid).length)).map(([cid,c])=>{
  const ks=kwsOf(cid),ac=activeContract(cid),x=ac&&ac[1]?ac[1]:ac;const total=x?x.total||0:0,done=x?x.done||0:0;
  let top10=0,on=0;for(const [,k] of ks){const b=bestOf(k);if(b<=10)top10++;if(isOn(k))on++;}
  const st=x?cStatus(x):null;const conf=[...S.posts.values()].filter(p=>p.clientId===cid&&postOk(p)&&(!x||((!x.start||(p.date||"")>=x.start)&&(!x.end||(p.date||"")<=x.end)))).length;return {cid,c,total,done,kw:ks.length,top10,on,st,end:x?x.end:"",conf};});}
function bigram(s){s=nz(s);const o=new Set();for(let i=0;i<s.length-1;i++)o.add(s.slice(i,i+2));return o;}
function reuseList(){const out=[];
  for(const [cid,c] of sortedClients()){if(!active(c))continue;const ks=kwsOf(cid);
    const good=ks.filter(([,k])=>bestOf(k)<=10&&k.postUrl&&/^https?:/.test(k.postUrl));if(!good.length)continue;
    for(const [id,k] of ks){if(isOn(k)||!TABS.some(tb=>latest(k,tb)))continue;const a=bigram(k.keyword);
      const sc=good.filter(([gid])=>gid!==id).map(([gid,g])=>{const b=bigram(g.keyword);let n=0;for(const x of a)if(b.has(x))n++;return {gid,g,s:n/Math.max(1,a.size+b.size-n),r:bestOf(g)};}).sort((x,y)=>y.s-x.s||x.r-y.r);
      if(sc.length)out.push({id,k,c,pick:sc.slice(0,2)});}}
  return out;}
function compAgg(){const m=new Map();let n=0;
  for(const [id,k] of K()){const c=S.clients.get(k.clientId);if(!c||!active(c)||!k.top)continue;
    for(const tb of TABS){const t=k.top[tb];if(!Array.isArray(t))continue;n++;const our=t.find(x=>x.ours);const lim=our?our.pos:t.length+1;
      for(const x of t){if(x.ours||x.pos>=lim||!x.author||!["blog","cafe"].includes(x.t))continue;const key=x.t+":"+x.author;const e=m.get(key)||{a:x.author,t:x.t,n:0,kws:new Set()};e.n++;e.kws.add(k.keyword);m.set(key,e);}}}
  return {n,list:[...m.values()].sort((a,b)=>b.n-a.n).slice(0,12)};}

function topTable(k,tb){const t=k.top&&k.top[tb];if(!Array.isArray(t)||!t.length)return `<p class="empty-mini">${WHERE[tb]} 기록이 아직 없어요. 다음 순위 확인부터 채워져요.</p>`;

function snapDb(){const P=fetch("data.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json();});
  const docs=m=>Object.keys(m||{}).map(id=>({id,data:()=>m[id]})),rej=()=>Promise.reject({code:"not_granted",message:"보기 전용"});
  const dobj=(c,id)=>({id,onSnapshot(f){P.then(S0=>{const v=(S0[c]||{})[id];f({exists:!!v,id,data:()=>v||{}});}).catch(()=>{});return()=>{};},get:()=>P.then(S0=>{const v=(S0[c]||{})[id];return {exists:!!v,id,data:()=>v||{}};}),set:rej,update:rej,delete:rej});
  const coll=n=>{const q={onSnapshot(f){P.then(S0=>f({docs:docs(S0[n])})).catch(()=>{});return()=>{};},get:()=>P.then(S0=>({docs:docs(S0[n])})),doc:id=>dobj(n,id||"x"+Math.random().toString(36).slice(2)),where:()=>q,orderBy:()=>q,limit:()=>q,add:rej};return q;};
  const PK={},pack=n=>PK[n]||(PK[n]=fetch("pack"+n+".jpg").then(r=>{if(!r.ok)throw {code:"not_found"};return r.arrayBuffer();}));
  const fl={read:p=>{const nm=p.split("/").pop().replace(/\.[a-z]+$/i,".jpg");return P.then(S0=>{const e=(S0._shots||{})[nm];if(!e)throw {code:"not_found"};return pack(e[0]).then(b=>({bytes:new Uint8Array(b.slice(e[1],e[1]+e[2]))}));});}};
  return {P,db:{collection:coll,doc:p=>{const a=p.split("/");return dobj(a[0],a[1]);}},files:fl};}

function kwNow(id,k,tb){const l=latest(k,tb),p=prevOf(k,tb);const r=l?l.r:undefined;const c=r===undefined?"":r==null?"g0":r<=3?"g1":r<=10?"g2":"g3";
  let mv="";if(l&&p){if(p.r==null&&r!=null)mv="새로 노출";else if(p.r!=null&&r==null)mv="순위 밖으로";else if(p.r!=null&&r!=null&&p.r!==r)mv=p.r>r?`${p.r-r}계단 올랐어요`:`${r-p.r}계단 내려갔어요`;else if(p.r===r)mv="변동 없음";}
  return `<div><span class="k">${WHERE[tb]}</span><span class="v ${c}">${!l?"–":r==null?"미노출":r+"<small>위</small>"}</span>${l&&Array.isArray(l.all)&&l.all.length>1?`<span class="lbl">업체 글 ${l.all.length}개가 보여요: ${l.all.join(", ")}위</span>`:""}<span class="lbl">${l?`${esc(shortDate(l.d))} 확인 · ${agoText(l.d)}${mv?` · ${mv}`:""}`:"기록 없음"}</span>
    <div class="acts">${shotOf(k,tb)?`<button class="btn small" data-shot="${esc(id)}" data-tab="${tb}">📷 캡처</button>`:""}<a class="btn small" href="${naverUrl(k.keyword,tb)}" target="_blank" rel="noopener">네이버에서 보기 ↗</a></div></div>`;}
function kwOpen(id){KWM=id;kwDraw();}
function kwClose(){KWM=null;const v=$("kwm");if(v)v.remove();}
function kwDraw(){const k=K().get(KWM);if(!k){kwClose();return;}const c=S.clients.get(k.clientId)||{};
  let v=$("kwm");if(!v){v=document.createElement("div");v.id="kwm";v.className="kwm";v.setAttribute("role","dialog");v.setAttribute("aria-modal","true");document.body.appendChild(v);}
  const pr=promoOf(k),url=k.postUrl&&/^https?:\/\//.test(k.postUrl)?k.postUrl:"";
  const posts=[...S.posts.values()].filter(p=>p.clientId===k.clientId&&postOk(p)&&(p.kwId===KWM||nz(p.keyword)===nz(k.keyword))).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  v.innerHTML=`<div class="kwm-box"><div class="kwm-h"><div><span class="lbl">${esc(c.name||"")}</span><h2>${esc(k.keyword)}</h2></div><div class="row" style="gap:6px"><button class="btn small" data-open="${esc(k.clientId)}" data-kwclose>업체 화면</button><button class="btn small" data-kwclose aria-label="닫기">닫기</button></div></div>
  <div class="kwm-b">
    <div class="kwm-now">${TABS.map(tb=>kwNow(KWM,k,tb)).join("")}</div>
    ${pr?`<div class="kwm-card"><h3>여기노출 30만 <span class="promo">통합 ${pr.r.join(", ")}위</span></h3><span class="lbl">판매 썸네일이 같은 화면에 떠 있어요 (${esc(pr.d||"")}).</span></div>`:""}
    <div class="kwm-card kwm-chart"><h3>최근 순위 변화<span class="kwm-leg"><span><i style="background:var(--r2)"></i>블로그탭</span><span><i style="background:var(--r1)"></i>통합검색</span></span></h3>${kwChart(k)}</div>
    <div class="kwm-card"><h3>우리 글 <span class="lbl">${posts.length}건</span></h3>${posts.length||url?`<div class="kwm-go">${url&&!posts.some(p=>p.url===url)?`<a class="glink" href="${esc(url)}" target="_blank" rel="noopener">현재 연결된 글 ↗</a>`:""}${posts.slice(0,6).map(p=>`<a class="glink" href="${esc(p.url||"#")}" target="_blank" rel="noopener">${esc(shortDate(p.date))} · ${esc(blogLabel(p.blog))} ↗</a>`).join("")}</div>`:`<p class="empty-mini">이 키워드로 찾은 우리 글이 아직 없어요.</p>`}
      ${canWrite?`<div class="kwm-go" style="margin-top:10px"><button class="btn small primary" data-drkw="${esc(k.clientId+"|"+k.keyword)}" data-kwclose>이 키워드로 원고 쓰기</button></div>`:""}</div>
    <div class="kwm-card"><h3>상위 10개 글 <span class="lbl">${k.top&&k.top.d?esc(k.top.d)+" 기준":""}</span></h3><div class="tabs2"><div><b class="lbl">블로그탭</b>${topTable(k,"blog")}</div><div><b class="lbl">통합검색</b>${topTable(k,"total")}</div></div></div>
  </div></div>`;}
document.addEventListener("click",e=>{const kd=e.target.closest&&e.target.closest("[data-kwd]");if(kd){kwOpen(kd.dataset.kwd);return;}
  if(e.target.id==="kwm"||(e.target.closest&&e.target.closest("[data-kwclose]")))kwClose();});

})();
</script>
</body></html>
